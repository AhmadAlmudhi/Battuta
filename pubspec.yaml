name: battuta
description: "A new Flutter project."
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.11.5

dependencies:
  characters: ^1.4.1
  cloud_firestore: ^7.0.0
  connectivity_plus: ^7.3.2
  cupertino_icons: ^2.0.0
  dio: ^5.11.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  freezed: ^4.0.3
  json_serializable: ^6.15.1
  drift_dev: ^2.35.1
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  config:
    # iOS builds with CocoaPods for now: Firebase's Swift Package Manager
    # release (13.x) needs Xcode 26.2 or later. Remove this line after
    # updating Xcode to switch iOS to Swift Package Manager.
    enable-swift-package-manager: false
  generate: true
  assets:
    - assets/data/countries_snapshot.json
    - assets/data/world_map.json
    - assets/flags/
    # Shown on the licenses page (OFL requires the license to travel with the font).
    - assets/fonts/alexandria/OFL.txt
  fonts:
    - family: Alexandria
      fonts:
        - asset: assets/fonts/alexandria/Alexandria-Regular.ttf
        - asset: assets/fonts/alexandria/Alexandria-Medium.ttf
          weight: 500
        - asset: assets/fonts/alexandria/Alexandria-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/alexandria/Alexandria-Bold.ttf
          weight: 700
