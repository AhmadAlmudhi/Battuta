# App icons for every platform from the logo (PRD section 1.4).
# Regenerate with: dart run flutter_launcher_icons
# Then revert its change to ios/Runner.xcodeproj/project.pbxproj: it wrongly
# sets ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS to AppIcon.
flutter_launcher_icons:
  image_path: "assets/icons/battuta_icon.png"
  android: true
  # Android adaptive icon: the stamp sits within the central 60%, so round
  # and rounded-square masks never clip it.
  adaptive_icon_foreground: "assets/icons/battuta_icon_foreground.png"
  adaptive_icon_background: "assets/icons/battuta_icon_background.png"
  # No extra inset: the artwork already has its margin built in.
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icons/battuta_icon.png"
    background_color: "#0E7C86"
    theme_color: "#0E7C86"
