<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Explore every country, record where you've been, and plan where to go next.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Battuta">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <!-- A larger icon, so high-resolution screens show a sharp tab icon. -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>

  <title>Battuta</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Draws at most 2 pixels per CSS pixel (PRD D-13). On sharper screens,
    most phones at 2.6x to 3.5x, Flutter would otherwise paint up to three
    times as many pixels each frame, which browsers without a fast GPU can't
    keep up with; the browser scales the canvas up instead. Flutter reads
    window.devicePixelRatio when it starts, so this runs first.
  -->
  <script>
    (function () {
      var max = 2;
      var descriptor =
        Object.getOwnPropertyDescriptor(window, 'devicePixelRatio') ||
        Object.getOwnPropertyDescriptor(Window.prototype, 'devicePixelRatio');
      if (!descriptor || !descriptor.get || !descriptor.configurable) return;
      var read = descriptor.get;
      Object.defineProperty(window, 'devicePixelRatio', {
        configurable: true,
        enumerable: descriptor.enumerable,
        get: function () {
          return Math.min(read.call(window), max);
        },
      });
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
